[project]
name = "registerhelper"
version = "0.1.0"
description = "Helps you register for courses faster"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "typer>=0.27.3",
]

[project.scripts]
rh = "registerhelper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]
